<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </div>
      <span class="header-title">MultiLogin</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-theme" title="切换主题">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 13V2a6 6 0 010 12z"/></svg>
      </button>
      <button class="icon-btn" id="btn-options" title="设置">
        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M7.429 1.525a6.593 6.593 0 011.142 0c.036.003.108.036.137.146l.289 1.105c.147.56.55.967.997 1.189.174.086.341.183.501.29.417.278.97.423 1.53.27l1.102-.303c.11-.03.175.016.195.046.219.31.41.641.573.989.014.031.022.11-.059.19l-.815.806c-.411.406-.562.957-.53 1.456a4.588 4.588 0 010 .582c-.032.499.119 1.05.53 1.456l.815.806c.08.08.073.159.059.19a6.494 6.494 0 01-.573.99c-.02.029-.086.074-.195.045l-1.103-.303c-.559-.153-1.112-.008-1.529.27-.16.107-.327.204-.5.29-.449.222-.851.628-.998 1.189l-.289 1.105c-.029.11-.1.143-.137.146a6.613 6.613 0 01-1.142 0c-.036-.003-.108-.037-.137-.146l-.289-1.105c-.147-.56-.55-.967-.997-1.189a4.502 4.502 0 01-.501-.29c-.417-.278-.97-.423-1.53-.27l-1.102.303c-.11.03-.175-.016-.195-.046a6.492 6.492 0 01-.573-.989c-.014-.031-.022-.11.059-.19l.815-.806c.411-.406.562-.957.53-1.456a4.587 4.587 0 010-.582c.032-.499-.119-1.05-.53-1.456l-.815-.806c-.08-.08-.073-.159-.059-.19a6.44 6.44 0 01.573-.99c.02-.029.086-.074.195-.045l1.103.303c.559.153 1.112.008 1.529-.27.16-.107.327-.204.5-.29.449-.222.851-.628.998-1.189l.289-1.105c.029-.11.1-.143.137-.146zM8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
      </button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="status-bar">
    <div class="status-dot"></div>
    <span id="status-text">检测中...</span>
  </div>

  <!-- Setup Screen (First Time) -->
  <div class="screen" id="screen-setup">
    <div class="unlock-icon">
      <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M4 4v2h-.25A1.75 1.75 0 002 7.75v5.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0014 13.25v-5.5A1.75 1.75 0 0012.25 6H12V4a4 4 0 10-8 0zm6.5 2V4a2.5 2.5 0 00-5 0v2h5z"/></svg>
    </div>
    <div class="unlock-title">设置主密码</div>
    <div class="unlock-subtitle">主密码用于加密你的 GitHub 账号数据</div>
    <div class="input-group">
      <input type="password" id="setup-password" placeholder="设置主密码" />
    </div>
    <div class="input-group">
      <input type="password" id="setup-confirm" placeholder="确认主密码" />
    </div>
    <button class="btn btn-primary" id="btn-setup">设置密码</button>
    <div class="error-msg" id="setup-error"></div>
  </div>

  <!-- Unlock Screen -->
  <div class="screen" id="screen-unlock">
    <div class="unlock-icon">
      <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M4 4v2h-.25A1.75 1.75 0 002 7.75v5.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0014 13.25v-5.5A1.75 1.75 0 0012.25 6H12V4a4 4 0 10-8 0zm6.5 2V4a2.5 2.5 0 00-5 0v2h5z"/></svg>
    </div>
    <div class="unlock-title">解锁 MultiLogin</div>
    <div class="unlock-subtitle">输入主密码以访问你的 GitHub 账号</div>
    <div class="input-group">
      <input type="password" id="unlock-password" placeholder="主密码" />
    </div>
    <button class="btn btn-primary" id="btn-unlock">解锁</button>
    <div class="error-msg" id="unlock-error"></div>
  </div>

  <!-- Main Screen -->
  <div class="screen" id="screen-main">
    <div class="section-header">
      <span class="section-title" id="account-count">账号列表</span>
    </div>
    <div class="account-list" id="account-list">
      <!-- Dynamically populated -->
    </div>
    <div class="quick-actions">
      <button class="btn-action" id="btn-save-current" title="保存当前账号">
        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M7.47 10.78a.75.75 0 001.06 0l3.75-3.75a.75.75 0 00-1.06-1.06L8.75 8.44V1.75a.75.75 0 00-1.5 0v6.69L4.78 5.97a.75.75 0 00-1.06 1.06l3.75 3.75zM3.75 13a.75.75 0 000 1.5h8.5a.75.75 0 000-1.5h-8.5z"/></svg>
        保存当前
      </button>
      <button class="btn-action" id="btn-copilot-check" title="检测当前账号 Copilot 状态">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M7.998 0a8 8 0 110 16 8 8 0 010-16zM5.6 7.6a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zm4.8 0a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4zM5.2 5.1c-.5.2-.8.6-1 1.1a.5.5 0 10.9.4c.1-.3.3-.5.5-.6.3-.1.7-.1 1.1.1a.5.5 0 10.4-.9c-.6-.3-1.3-.4-1.9-.1zm5.6 0c-.6-.3-1.3-.2-1.9.1a.5.5 0 10.4.9c.4-.2.8-.2 1.1-.1.2.1.4.3.5.6a.5.5 0 10.9-.4c-.2-.5-.5-.9-1-1.1z"/></svg>
        Copilot
      </button>
      <button class="btn-action" id="btn-logout-github" title="退出 GitHub 登录">
        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 010 1.5h-2.5a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 010 1.5h-2.5A1.75 1.75 0 012 13.25V2.75zm10.44 4.5H6.75a.75.75 0 000 1.5h5.69l-1.97 1.97a.749.749 0 101.06 1.06l3.25-3.25a.749.749 0 000-1.06l-3.25-3.25a.749.749 0 10-1.06 1.06l1.97 1.97z"/></svg>
        退出登录
      </button>
      <button class="btn-action" id="btn-manage" title="打开管理页面">
        <svg viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M7.429 1.525a6.593 6.593 0 011.142 0c.036.003.108.036.137.146l.289 1.105c.147.56.55.967.997 1.189.174.086.341.183.501.29.417.278.97.423 1.53.27l1.102-.303c.11-.03.175.016.195.046.219.31.41.641.573.989.014.031.022.11-.059.19l-.815.806c-.411.406-.562.957-.53 1.456a4.588 4.588 0 010 .582c-.032.499.119 1.05.53 1.456l.815.806c.08.08.073.159.059.19a6.494 6.494 0 01-.573.99c-.02.029-.086.074-.195.045l-1.103-.303c-.559-.153-1.112-.008-1.529.27-.16.107-.327.204-.5.29-.449.222-.851.628-.998 1.189l-.289 1.105c-.029.11-.1.143-.137.146a6.613 6.613 0 01-1.142 0c-.036-.003-.108-.037-.137-.146l-.289-1.105c-.147-.56-.55-.967-.997-1.189a4.502 4.502 0 01-.501-.29c-.417-.278-.97-.423-1.53-.27l-1.102.303c-.11.03-.175-.016-.195-.046a6.492 6.492 0 01-.573-.989c-.014-.031-.022-.11.059-.19l.815-.806c.411-.406.562-.957.53-1.456a4.587 4.587 0 010-.582c.032-.499-.119-1.05-.53-1.456l-.815-.806c-.08-.08-.073-.159-.059-.19a6.44 6.44 0 01.573-.99c.02-.029.086-.074.195-.045l1.103.303c.559.153 1.112.008 1.529-.27.16-.107.327-.204.5-.29.449-.222.851-.628.998-1.189l.289-1.105c.029-.11.1-.143.137-.146zM8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
        管理
      </button>
    </div>
    <!-- Copilot 检测结果 -->
    <div class="copilot-result" id="copilot-result" style="display:none"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="footer-count"></span>
    <a href="#" id="btn-lock">锁定</a>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading" style="display:none">
    <div class="spinner"></div>
    <span id="loading-text">处理中...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
